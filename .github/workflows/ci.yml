name: Hisaaby Buddy CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Frontend Verification & TypeScript Build
  # ----------------------------------------------------------------------------
  frontend-check:
    name: ⚡ Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: 🏗 Run TypeScript & Vite Build
        run: |
          cd frontend
          npm run build

  # ----------------------------------------------------------------------------
  # Job 2: Backend Lint & Import Verification
  # ----------------------------------------------------------------------------
  backend-check:
    name: 🐍 Backend Python & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: 📦 Install Core Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic python-dotenv python-multipart requests httpx groq pinecone-client

      - name: 🔍 Verify Python Code Syntax
        run: |
          python -m py_compile backend/main.py
          python -m py_compile backend/routers/*.py
          python -m py_compile backend/services/storage_service.py
          python -m py_compile backend/core/*.py
